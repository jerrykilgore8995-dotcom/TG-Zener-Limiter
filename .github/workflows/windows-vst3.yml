name: Build TG12413 Limiter VST3
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Reassemble and extract JUCE source bundle
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -Path ".source-transfer" -Filter "part*.b64" | Sort-Object Name)
          if ($parts.Count -ne 25) { throw "Expected 25 source-package transfer segments. Found $($parts.Count)." }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) { [void] $builder.Append([System.IO.File]::ReadAllText($part.FullName).Trim()) }
          $bytes = [Convert]::FromBase64String($builder.ToString())
          [System.IO.File]::WriteAllBytes((Join-Path $PWD "TG12413-source.zip"), $bytes)
          Write-Host "Reassembled TG12413-source.zip ($($bytes.Length) bytes)"
          Expand-Archive -LiteralPath "TG12413-source.zip" -DestinationPath "." -Force
          @("CMakeLists.txt","Source/PluginProcessor.cpp","Source/PluginEditor.cpp","Source/TGFastZenerLimiter.h","Source/TGReferenceGrid.h","reference/TGZener4Freq_THD2pct_InputScaled.bin","tools/generate_gui_assets.py") | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing expected source: $_" }
          }

      - name: Integrate illuminated attack button and 1/8/15ms DSP
        run: python .build-updates/apply_illuminated_attack.py

      - name: Integrate fixed 4x FIR oversampling with PDC and anti-alias regression
        run: python .build-updates/apply_4x_oversampling.py

      - name: Install image-asset generator dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate authentic TG12413 rack GUI assets
        shell: pwsh
        run: |
          $s = [System.IO.File]::ReadAllText((Join-Path $PWD "tools/generate_gui_assets.py"))
          $s = $s.Replace("FONT='/usr/share/fonts/truetype/lato/Lato-Medium.ttf'", "FONT='C:/Windows/Fonts/arial.ttf'")
          $s = $s.Replace("BOLD='/usr/share/fonts/truetype/lato/Lato-Bold.ttf'", "BOLD='C:/Windows/Fonts/arialbd.ttf'")
          $s = $s.Replace("SERIF='/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'", "SERIF='C:/Windows/Fonts/georgiab.ttf'")
          [System.IO.File]::WriteAllText((Join-Path $PWD "tools/generate_gui_assets.py"), $s)
          python tools/generate_gui_assets.py
          @("Assets/faceplate.png","Assets/knob_red.png","Assets/knob_blue.png","Assets/button_on.png","Assets/button_off.png") | ForEach-Object {
            if (!(Test-Path $_)) { throw "Asset creation failed: $_" }
          }

      - name: JUCE 8 state serialization compatibility
        shell: pwsh
        run: |
          $path = Join-Path $PWD "Source/PluginProcessor.cpp"
          $s = [System.IO.File]::ReadAllText($path)
          if (!$s.Contains("juce::copyXmlToBinary(*xml, destData)") -or !$s.Contains("juce::getXmlFromBinary(data, size)")) { throw "Expected legacy JUCE state code not found; inspect sources before patching." }
          $s = $s.Replace('    if (auto xml = parameters.copyState().createXml())', '    juce::MemoryOutputStream stream(destData, false);')
          $s = $s.Replace('        juce::copyXmlToBinary(*xml, destData);', '    parameters.copyState().writeToStream(stream);')
          $s = $s.Replace('    if (auto xml = juce::getXmlFromBinary(data, size))', '    const auto state = juce::ValueTree::readFromData(data, static_cast<size_t>(size));')
          $s = $s.Replace('        if (xml->hasTagName(parameters.state.getType().toString()))', '    if (state.isValid() && state.hasType(parameters.state.getType()))')
          $s = $s.Replace('            parameters.replaceState(juce::ValueTree::fromXml(*xml));', '        parameters.replaceState(state);')
          [System.IO.File]::WriteAllText($path, $s)
          Write-Host "Applied JUCE 8 binary state serialization fix"

      - name: Configure JUCE VST3 (MSVC x64)
        shell: pwsh
        run: |
          $cmake = [System.IO.File]::ReadAllText((Join-Path $PWD "CMakeLists.txt"))
          $cmake = $cmake.Replace("LANGUAGES CXX", "LANGUAGES C CXX")
          [System.IO.File]::WriteAllText((Join-Path $PWD "CMakeLists.txt"), $cmake)
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build DSP tests
        run: cmake --build build --config Release --target tg_test_basic tg_test_controls tg_test_program tg_test_autotrack tg_test_detector_clean tg_test_spectra tg_test_embedded_memory tg_test_attack tg_test_oversampling --parallel 3

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Windows VST3
        run: cmake --build build --config Release --target TGZenerRack_VST3 --parallel 3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TG12413-Limiter-v1.3-4xFIR-Windows-x64-VST3
          path: build/TGZenerRack_artefacts/Release/VST3/
          if-no-files-found: error
